# ══════════════════════════════════════════════════════════════════════════
# Netlify · app estática, sin paso de compilación
# ══════════════════════════════════════════════════════════════════════════

[build]
  publish = "web"
  # No hay bundler ni framework: se publica el directorio tal cual.
  command = ""

[build.environment]
  NODE_VERSION = "20"

# ── Cabeceras de seguridad ────────────────────────────────────────────────
# supabase-js va servido desde el propio sitio (web/vendor/), así que script-src
# se queda en 'self': ni CDN externo ni 'unsafe-inline'. Solo quedan dos
# orígenes externos:
#   *.supabase.co         → REST y autenticación (wss para realtime)
#   raw.githubusercontent → los GIF del catálogo de ejercicios
# style-src sí lleva 'unsafe-inline' porque la interfaz usa atributos style="…"
# heredados del prototipo.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self' https://owhxwqktbkpiqrnqnkhn.supabase.co wss://owhxwqktbkpiqrnqnkhn.supabase.co; img-src 'self' data: https://raw.githubusercontent.com; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; worker-src 'self'; manifest-src 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Los datos son grandes e inmutables mientras no se regeneren: caché larga
# con revalidación para no descargar 1,8 MB en cada visita.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Rutas ─────────────────────────────────────────────────────────────────
# La app es una sola página con vistas internas: cualquier ruta desconocida
# devuelve index.html en lugar de un 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
